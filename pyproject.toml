[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobseekeragent"
version = "0.1.0"
description = "A lightweight agent that scores job postings for a candidate profile"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "JobSeekerAgent Contributors" }]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
